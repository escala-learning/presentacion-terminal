      <!-- Cargos y personas: los que pidió Andina en la ronda del 2026-10-28. Sección «Créditos» del Word
           (cargo, persona, versión y año), con la pieza de Andina
           (.ua-creditos, como la plantilla-base) y sin fotografías: el Word no las trae. La línea de la
           unidad sale de la portada del DI; el © es lo fijo de la institución. -->
      <section class="ua-creditos" data-reveal>
        <p class="ua-creditos__unidad">Unidad 3. Gobierno, calidad y protección de datos</p>
        <dl class="ua-creditos__roles">
          <div class="ua-creditos__rol">
            <dt><strong>Docente autor</strong></dt>

          </div>
          <div class="ua-creditos__rol">
            <dt><strong>Asesor tecnopedagógico</strong></dt>
            <dd>Luz Bedoya</dd>
          </div>
          <div class="ua-creditos__rol">
            <dt><strong>Diseñador instruccional</strong></dt>
            <dd>Nombre de diseñador instruccional</dd>
          </div>
        </dl>
        <footer class="ua-creditos__pie">
          <span>Versión 1</span>
          <span>© 2026 Universidad Andina Virtual. Todos los derechos reservados.</span>
        </footer>
      </section>
